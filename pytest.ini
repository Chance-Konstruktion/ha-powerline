[pytest]
# Nur tests/. Ohne diese Zeile sammelt pytest auch tests_ha/ ein -- und
# diese Suite ersetzt das Paket ``homeassistant`` durch Attrappen, waehrend
# tests_ha ein echtes braucht. Genau daran ist der Lauf zerbrochen, als
# tests_ha dazukam: ModuleNotFoundError beim Einsammeln, kein einziger Test
# gelaufen. Zwei Verzeichnisse, zwei Laeufe -- der zweite steht in
# pytest-ha.ini.
testpaths = tests
